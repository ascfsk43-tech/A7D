<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A7D | Official Profile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background: #000;
        }

        /* Glassmorphism visual style */
        .glass-card {
            background: rgba(12, 12, 18, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        /* Neon Glow Text Animation */
        .glow-text {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7),
                         0 0 30px rgba(239, 68, 68, 0.5),
                         0 0 45px rgba(239, 68, 68, 0.3);
        }

        .avatar-glow {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5),
                        0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* Click to Enter Overlay Animation */
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-enter-pulse {
            animation: pulse-slow 2.2s infinite ease-in-out;
        }

        /* Audio Progress Bar Styling */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        /* Video element layering */
        #bg-video {
            object-fit: cover;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="text-white relative min-h-screen flex items-center justify-center p-4">

    <!-- 1. Background Video Layer (Positioned behind everything) -->
    <video id="bg-video" autoplay loop muted playsinline preload="auto" poster="unnamed-file-32.jpg" class="fixed inset-0 w-full h-full object-cover z-0 pointer-events-none">
        <source src="video_1.mp4" type="video/mp4">
        <source src="تشكيلات الطائرات المقاتلة لسلاح الجو السلطاني العُماني، ضمن العرض العسكري الكبير __.mp4" type="video/mp4">
    </video>
    
    <!-- Light Dark Overlay over video for text readability -->
    <div class="fixed inset-0 bg-black/25 z-0 pointer-events-none"></div>

    <!-- Background Audio Element -->
    <audio id="bg-audio" loop preload="auto">
        <source src="vidssave.com شيلة جيشنا يا جيشنا 🇴🇲❤🇴🇲 الجيش العُماني 48KBPS.mp3" type="audio/mp3">
    </audio>

    <!-- 2. Sound Mute/Unmute Quick Toggle Button (Top-Left) -->
    <button id="mute-toggle-btn" class="fixed top-5 left-5 z-30 glass-button w-11 h-11 rounded-full flex items-center justify-center text-white/90 hover:text-white shadow-xl" title="كتم/تشغيل الصوت">
        <i id="mute-icon" class="fas fa-volume-up text-lg"></i>
    </button>

    <!-- 3. Click to Enter Screen Overlay (Translucent background to view video behind) -->
    <div id="enter-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity duration-700 cursor-pointer">
        <div class="text-center p-6 animate-enter-pulse select-none">
            <div class="w-20 h-20 mx-auto mb-5 rounded-full border-2 border-white/40 flex items-center justify-center glass-button shadow-2xl">
                <i class="fas fa-play text-2xl text-white mr-0.5"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-widest text-white mb-2">اضغط للدخول</h1>
            <p class="text-xs md:text-sm text-gray-200 font-sans tracking-widest uppercase">Click to Enter</p>
        </div>
    </div>

    <!-- 4. Main Bio Content Container -->
    <main class="relative z-10 w-full max-w-md flex flex-col gap-4 my-auto">
        
        <!-- Main Profile Card -->
        <div class="glass-card rounded-3xl p-6 md:p-8 flex flex-col items-center text-center relative overflow-hidden transition-transform duration-500 hover:scale-[1.01]">
            
            <!-- Top Subtle Lighting Glow Accent -->
            <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-48 h-48 bg-red-600/30 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Profile Avatar -->
            <div class="relative mb-4 group">
                <div class="w-28 h-28 md:w-32 md:h-32 rounded-full overflow-hidden border-2 border-white/40 avatar-glow transition-transform duration-300 group-hover:scale-105">
                    <img src="https://cdn.discordapp.com/attachments/1550795807525970040/1570482758545965217/unnamed-file-32.jpg?ex=6af7418b&is=6af5f00b&hm=c3b665b5dbac8478dbdb30b493f4c5a3355fa5cc3dfb605ced20b2e029d470fa&" alt="A7D Profile" class="w-full h-full object-cover" onerror="this.src='unnamed-file-32.jpg'">
                </div>
                <!-- Online Status Dot -->
                <div class="absolute bottom-1 right-2 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full shadow-lg" title="متصل الأن"></div>
            </div>

            <!-- Name with Neon Glow -->
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider text-white glow-text mb-1 font-sans">
                A7D
            </h1>

            <!-- Bio / Subtitle -->
            <p class="text-sm text-gray-200 font-medium mb-3 flex items-center gap-1.5 justify-center">
                <span>عُمان العظيمة</span>
                <span class="text-base">🇴🇲</span>
            </p>

            <!-- Location Badge -->
            <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-white/10 border border-white/20 text-xs text-gray-200 mb-6">
                <i class="fas fa-location-dot text-red-500"></i>
                <span>السلطنة | Oman</span>
            </div>

            <!-- Social Links (Discord & KICK) -->
            <div class="w-full flex items-center justify-center gap-3.5 mb-6">
                <!-- Discord Button -->
                <a href="https://discord.gg/MHKQuJ7Grw" target="_blank" rel="noopener noreferrer" 
                   class="glass-button px-5 py-3 rounded-2xl flex items-center gap-2.5 text-white/95 hover:text-white w-1/2 justify-center font-semibold text-sm group">
                    <i class="fab fa-discord text-xl text-[#5865F2] group-hover:scale-110 transition-transform"></i>
                    <span>Discord</span>
                </a>

                <!-- Kick Button -->
                <a href="https://kick.com/shsjsjqiiweuueieieiei" target="_blank" rel="noopener noreferrer" 
                   class="glass-button px-5 py-3 rounded-2xl flex items-center gap-2.5 text-white/95 hover:text-white w-1/2 justify-center font-semibold text-sm group">
                    <svg class="w-5 h-5 fill-[#53FC18] group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                        <path d="M3 2h18v20H3V2zm4.5 3v14h3v-4.5l3.5 4.5h4l-4.5-5.5L18 8h-4l-3.5 4.5V5h-3z"/>
                    </svg>
                    <span>KICK</span>
                </a>
            </div>

            <!-- Views Counter -->
            <div class="w-full flex justify-between items-center text-xs text-gray-300 pt-3 border-t border-white/15 px-1">
                <div class="flex items-center gap-1.5 bg-black/40 px-3 py-1 rounded-lg border border-white/10">
                    <i class="far fa-eye text-gray-300"></i>
                    <span id="view-count" class="font-mono text-gray-100 font-bold">1,337</span>
                </div>
                <div class="text-[11px] text-gray-300 tracking-wider font-mono">
                    ONLINE • BIO
                </div>
            </div>

        </div>

        <!-- 5. Glass Music Player Card -->
        <div class="glass-card rounded-2xl p-4 flex flex-col gap-3 relative overflow-hidden transition-transform duration-500 hover:scale-[1.01]">
            
            <div class="flex items-center justify-between gap-3">
                <!-- Song Info -->
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-xl bg-red-600/30 border border-red-500/40 flex items-center justify-center shrink-0">
                        <i id="music-disc" class="fas fa-music text-red-400 text-sm"></i>
                    </div>
                    <div class="flex flex-col text-right overflow-hidden">
                        <span class="text-xs font-bold text-white truncate">شيلة جيشنا يا جيشنا 🇴🇲</span>
                        <span class="text-[10px] text-gray-300">الجيش السلطاني العُماني</span>
                    </div>
                </div>

                <!-- Player Controls -->
                <div class="flex items-center gap-2 dir-ltr">
                    <!-- Rewind 5s -->
                    <button id="rewind-btn" class="w-8 h-8 rounded-full glass-button flex items-center justify-center text-xs text-gray-200 hover:text-white" title="إرجاع 5 ثوانٍ">
                        <i class="fas fa-backward"></i>
                    </button>
                    <!-- Play / Pause -->
                    <button id="play-btn" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center text-sm font-bold shadow-lg hover:scale-105 transition-transform" title="تشغيل / إيقاف">
                        <i id="play-icon" class="fas fa-play ml-0.5"></i>
                    </button>
                    <!-- Forward 5s -->
                    <button id="forward-btn" class="w-8 h-8 rounded-full glass-button flex items-center justify-center text-xs text-gray-200 hover:text-white" title="تقديم 5 ثوانٍ">
                        <i class="fas fa-forward"></i>
                    </button>
                </div>
            </div>

            <!-- Audio Slider & Progress Timers -->
            <div class="flex flex-col gap-1">
                <input id="seek-slider" type="range" min="0" max="100" value="0" class="w-full h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-white">
                <div class="flex justify-between items-center text-[10px] text-gray-300 font-mono px-0.5 dir-ltr">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const enterOverlay = document.getElementById('enter-overlay');
            const bgVideo = document.getElementById('bg-video');
            const bgAudio = document.getElementById('bg-audio');
            
            // Force playing video on load
            const playVideoPromise = bgVideo.play();
            if (playVideoPromise !== undefined) {
                playVideoPromise.catch(err => {
                    console.log('Autoplay blocked, playing on user interaction', err);
                });
            }

            const playBtn = document.getElementById('play-btn');
            const playIcon = document.getElementById('play-icon');
            const rewindBtn = document.getElementById('rewind-btn');
            const forwardBtn = document.getElementById('forward-btn');
            
            const muteToggleBtn = document.getElementById('mute-toggle-btn');
            const muteIcon = document.getElementById('mute-icon');
            
            const seekSlider = document.getElementById('seek-slider');
            const currentTimeEl = document.getElementById('current-time');
            const totalDurationEl = document.getElementById('total-duration');
            const musicDisc = document.getElementById('music-disc');
            const viewCountEl = document.getElementById('view-count');

            let isPlaying = false;

            // Increment View Counter
            try {
                let views = parseInt(localStorage.getItem('a7d_views') || '1337');
                views += 1;
                localStorage.setItem('a7d_views', views);
                viewCountEl.textContent = views.toLocaleString();
            } catch (e) {
                viewCountEl.textContent = '1,337';
            }

            // Click to Enter Action
            enterOverlay.addEventListener('click', () => {
                enterOverlay.style.opacity = '0';
                setTimeout(() => {
                    enterOverlay.style.display = 'none';
                }, 700);

                // Ensure video is playing
                bgVideo.play().catch(e => console.log('Video error:', e));

                // Play Background Music
                bgAudio.play().then(() => {
                    isPlaying = true;
                    updatePlayState();
                }).catch(err => {
                    console.log('Audio play error:', err);
                });
            });

            // Toggle Audio Play / Pause
            function togglePlay() {
                if (bgAudio.paused) {
                    bgAudio.play().then(() => {
                        isPlaying = true;
                        updatePlayState();
                    });
                } else {
                    bgAudio.pause();
                    isPlaying = false;
                    updatePlayState();
                }
            }

            playBtn.addEventListener('click', togglePlay);

            function updatePlayState() {
                if (!bgAudio.paused) {
                    playIcon.className = 'fas fa-pause';
                    musicDisc.classList.add('animate-spin');
                    musicDisc.style.animationDuration = '4s';
                } else {
                    playIcon.className = 'fas fa-play ml-0.5';
                    musicDisc.classList.remove('animate-spin');
                }
            }

            // Mute / Unmute Audio
            muteToggleBtn.addEventListener('click', () => {
                if (bgAudio.muted) {
                    bgAudio.muted = false;
                    muteIcon.className = 'fas fa-volume-up text-lg';
                } else {
                    bgAudio.muted = true;
                    muteIcon.className = 'fas fa-volume-mute text-lg text-red-400';
                }
            });

            // Rewind 5 seconds
            rewindBtn.addEventListener('click', () => {
                bgAudio.currentTime = Math.max(0, bgAudio.currentTime - 5);
            });

            // Forward 5 seconds
            forwardBtn.addEventListener('click', () => {
                bgAudio.currentTime = Math.min(bgAudio.duration || 0, bgAudio.currentTime + 5);
            });

            // Time Formatter (mm:ss)
            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Sync Progress Bar and Duration
            bgAudio.addEventListener('timeupdate', () => {
                if (bgAudio.duration) {
                    const progress = (bgAudio.currentTime / bgAudio.duration) * 100;
                    seekSlider.value = progress;
                    currentTimeEl.textContent = formatTime(bgAudio.currentTime);
                    totalDurationEl.textContent = formatTime(bgAudio.duration);
                }
            });

            bgAudio.addEventListener('loadedmetadata', () => {
                totalDurationEl.textContent = formatTime(bgAudio.duration);
            });

            // Seek Position Change
            seekSlider.addEventListener('input', () => {
                if (bgAudio.duration) {
                    const seekTime = (seekSlider.value / 100) * bgAudio.duration;
                    bgAudio.currentTime = seekTime;
                }
            });

            // Video loop guarantee
            bgVideo.addEventListener('ended', () => {
                bgVideo.currentTime = 0;
                bgVideo.play();
            });
        });
    </script>
</body>
</html>
